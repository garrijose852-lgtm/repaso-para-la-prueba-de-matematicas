<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso a Recursos - Examen Final</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 text-center shadow-2xl">
        <h1 class="text-2xl font-bold text-pink-500 mb-2">📚 Acceso Exclusivo</h1>
        <p class="text-gray-400 text-sm mb-6">Escanea el código QR para acceder al documento de práctica y repaso autorizado.</p>
        
        <div class="bg-white p-4 rounded-xl inline-block shadow-md mb-4">
            <div id="qrcode"></div>
        </div>

        <p class="text-xs text-gray-500">Asegúrate de escanearlo con la cámara de tu dispositivo móvil.</p>
    </div>

    <script>
        // Genera dinámicamente el QR apuntando a rickroll.html de este mismo GitHub Pages
        const urlDestino = window.location.origin + window.location.pathname.replace("index.html", "") + "rickroll.html";

        new QRCode(document.getElementById("qrcode"), {
            text: urlDestino,
            width: 180,
            height: 180,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
