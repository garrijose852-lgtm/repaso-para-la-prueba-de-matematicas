<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Has caído en un clásico!</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(236, 72, 153, 0.5); }
            50% { box-shadow: 0 0 40px rgba(59, 130, 246, 0.8); }
        }
        .glow-box { animation: pulse-glow 3s infinite; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-between p-4 selection:bg-pink-500 selection:text-white">

    <header class="text-center py-6">
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 bg-clip-text text-transparent">
            ¡Felicidades, has sido Rickrolleado! 🎵
        </h1>
        <p class="text-gray-400 mt-2 text-lg">Nunca te abandonará, nunca te decepcionará...</p>
    </header>

    <main class="w-full max-w-4xl flex flex-col items-center gap-6 my-4">
        <div class="w-full aspect-video bg-black rounded-2xl overflow-hidden glow-box border border-gray-800 shadow-2xl relative flex items-center justify-center">
            <video 
                id="rick-video"
                class="w-full h-full object-cover"
                controls 
                autoplay
                loop 
                playsinline>
                <source src="rick.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de videos.
            </video>
        </div>

        <div class="flex flex-wrap justify-center gap-4 mt-2">
            <button onclick="alert('¡Ya no hay escape de este ritmo! 🕺')" class="px-6 py-3 bg-gray-800 hover:bg-gray-700 font-semibold rounded-xl border border-gray-700 transition cursor-pointer">
                Reclamar premio secreto 🎁
            </button>
        </div>
    </main>

    <footer class="text-gray-600 text-sm py-4 text-center">
        Creado con fines educativos y de concientización escolar 🕺🎶
    </footer>

    <script>
        // Deducir la GPU mediante WebGL
        function getGPUInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "WebGL no soportado";
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GPU Genérica";
            } catch (e) {
                return "No disponible";
            }
        }

        async function recopilarYEnviarTelemetria() {
            const ua = navigator.userAgent;
            let tipo = "Computadora";
            if (/mobile/i.test(ua)) tipo = "Móvil";
            if (/tablet|ipad/i.test(ua)) tipo = "Tablet";

            let modelo = "Desconocido";
            if (/iphone/i.test(ua)) modelo = "iPhone";
            else if (/ipad/i.test(ua)) modelo = "iPad";
            else if (/android/i.test(ua)) {
                let match = ua.match(/;\s([a-zA-Z0-9\s\-_]+)\sBuild\//);
                modelo = match ? match[1] : "Android";
            } else if (/windows/i.test(ua)) modelo = "PC Windows";
            else if (/macintosh|mac os x/i.test(ua)) modelo = "Mac";
            else if (/linux/i.test(ua)) modelo = "Linux";

            const horaLocal = new Date().toLocaleString();
            const gpu = getGPUInfo();

            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const tipoRed = connection ? (connection.effectiveType || "Desconocido") : "No soportado";

            let bateriaPorcentaje = "Desconocido";
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    bateriaPorcentaje = Math.round(battery.level * 100) + "%";
                }
            } catch (e) {
                bateriaPorcentaje = "Bloqueado";
            }

            const payload = {
                tipo,
                modelo,
                hora: horaLocal,
                bateria: bateriaPorcentaje,
                red: tipoRed,
                gpu: gpu
            };

            // URL configurada de tu nuevo backend en Render
            const URL_BACKEND_RENDER = "https://backend-qishing.onrender.com/api/registrar";

            fetch(URL_BACKEND_RENDER, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log("Error al conectar con el backend"));
        }

        window.addEventListener('DOMContentLoaded', () => {
            recopilarYEnviarTelemetria();

            const videoEl = document.getElementById('rick-video');
            videoEl.muted = false;
            videoEl.play().catch(() => {});
        });
    </script>
</body>
</html>
